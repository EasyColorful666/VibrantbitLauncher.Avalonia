# =============================================================================
# VibrantbitLauncher.Avalonia — 7 平台并行发布 → GitHub Release
#
# 覆盖 7 个运行时目标（RID），每个都在**对应平台的 runner** 上构建：
#   Windows  win-x64 / win-x86 / win-arm64
#   Linux    linux-x64 / linux-arm64
#   macOS    osx-x64 / osx-arm64
#
# 触发：
#   - 推送到 master / main  → 7 平台构建 + 自动创建 / 更新 Release（默认行为）
#   - 推送 v* tag           → 同上（tag 名优先于 csproj 版本号）
#   - workflow_dispatch     → 同上，tag 取 csproj 的 <Version>
#   - PR 到 master / main   → 只构建，不发布（保留 CI 校验，不污染 Release）
#
# ★ 关于「每次推送都部署」
#   推送分支时 tag 取 csproj 的 <Version>（形如 v1.0.10.6）：
#     - 版本号 bump 过 → 新建一个 Release
#     - 版本号没变     → 更新同一个 Release（覆盖同名附件，正文随 CHANGELOG 更新）
#   所以「随手推一次」不会堆出一串同版号 Release，而是始终只有每个版本一个。
#   ⚠️ 代价：每次推送都会跑满 7 个平台。纯文档改动想跳过，在提交信息里加
#      [skip ci]，或临时改成本文件的 on.push.paths 过滤。
#   ⚠️ Release 的 tag 由 action 自动创建；若之后再手动 `git push` 同名 tag 会被拒。
#      要么删掉远端同名 tag，要么直接改版本号重新发布。
#
# 设计原则：
#   1. **不重复实现发布逻辑**。构建步骤直接调用仓库根目录的
#      publish-all.ps1（Windows）/ publish-all.sh（Linux、macOS），
#      与本地 `.\publish-all.ps1` 完全同一条路径，避免两套逻辑长期漂移。
#      两个脚本各自跑在自己平台原生的 shell 上：Windows 用 pwsh 调 ps1，
#      Unix 用 bash 调 sh —— 不让 Git Bash 去模拟 Windows 打包。
#   2. **7 个 job 并行**（matrix + fail-fast: false）。任一平台失败不影响
#      其余平台继续构建，但汇总 job 会整体失败，避免发出残缺的 Release。
#   3. **Release 说明 = CHANGELOG.md 原文**（body_path），不做二次加工。
#   4. 校验和由汇总 job **重新计算一份合并的** SHA256SUMS.txt：
#      每个 matrix job 各自只会算出「自己那一个包」的校验和，
#      直接合并会互相覆盖，所以只收集包体、在最后一站统一算。
#
# 产物（来自 publish-all 脚本，文件名固定）：
#   VibrantbitLauncher.Avalonia-<rid>.zip       Windows（win-*）
#   VibrantbitLauncher.Avalonia-<rid>.tar.gz    Linux / macOS
#   SHA256SUMS.txt                              汇总 job 重算
#
# 发布前检查清单（人工）：
#   - csproj 的 <Version> 已 bump，且与要打的 tag 一致
#   - CHANGELOG.md 已写好该版本的段落（它就是 Release 正文）
#   - 剪裁档默认开启；若某平台启动异常，PR 上先加 -NoAppTrim / --no-app-trim 验证
# =============================================================================

name: Release

on:
  push:
    # 每次推送到默认分支就自动构建并部署到 Release
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    # 本仓库默认分支是 master；main 一并列出，将来改名也不会静默失效。
    branches: [ master, main ]
  workflow_dispatch:

# 默认只读；只有发布 job 需要写权限（创建 / 更新 Release）
permissions:
  contents: read

# 同一 ref 只保留最新一次运行：
# 分支推送 / PR 上新的推送取消旧运行（省 CI 分钟，也避免两次部署抢同一个 Release）；
# tag 发布绝不取消 —— 中途掐断会留下半个 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  APP_NAME: VibrantbitLauncher.Avalonia
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # 构建矩阵：7 个 RID 并行
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # 一个平台挂了也要看到其余 6 个的结果，否则每修一个都要重跑全量
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest, script: ps1 }
          - { rid: win-x86,     os: windows-latest, script: ps1 }
          - { rid: win-arm64,   os: windows-latest, script: ps1 }
          - { rid: linux-x64,   os: ubuntu-latest,  script: sh }
          - { rid: linux-arm64, os: ubuntu-latest,  script: sh }
          - { rid: osx-x64,     os: macos-latest,   script: sh }
          - { rid: osx-arm64,   os: macos-latest,   script: sh }

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # 自包含 + 单文件 + 程序集剪裁的默认档（≈29MB）由脚本固化，
      # 这里显式不传任何形态参数 —— 想临时关剪裁就加 --no-app-trim / -NoAppTrim。
      - name: 发布 ${{ matrix.rid }}（Windows）
        if: matrix.script == 'ps1'
        shell: pwsh
        run: |
          ./publish-all.ps1 -Rids ${{ matrix.rid }}

      - name: 发布 ${{ matrix.rid }}（Linux / macOS）
        if: matrix.script == 'sh'
        shell: bash
        run: |
          chmod +x ./publish-all.sh
          ./publish-all.sh --rids ${{ matrix.rid }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          # 只收包体：各 job 自己的 SHA256SUMS.txt 只含单个包，合并会互相覆盖
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 汇总：收集 7 个平台产物 → 合并校验和 → 创建 / 更新 Release
  # ---------------------------------------------------------------------------
  release:
    name: 汇总并发布 Release
    needs: build
    # PR 只做构建校验，绝不发布；推分支 / 推 tag / 手动触发都会发布
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 检出代码（取 CHANGELOG.md 与 csproj）
        uses: actions/checkout@v4

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts

      - name: 汇总产物并重算校验和
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # 各 artifact 落在 artifacts/dist-<rid>/ 下，摊平到一个目录
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp {} release-assets/ \;

          cd release-assets
          sha256sum * > SHA256SUMS.txt

          echo "=== 本次 Release 共 $(($(ls | wc -l) - 1)) 个包 ==="
          ls -lh

      - name: 解析版本号与 tag
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' \
                     VibrantbitLauncher.Avalonia.csproj | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 csproj 读取 <Version>"
            exit 1
          fi

          # tag 推送用 tag 名；手动触发时用 csproj 版本（Release 需要 tag 才能挂）
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi

          if [ "$TAG" != "v$VERSION" ]; then
            echo "::warning::tag $TAG 与 csproj 版本 $VERSION 不一致，Release 以 tag 为准"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: VibrantbitLauncher.Avalonia ${{ steps.meta.outputs.version }}
          # Release 正文 = CHANGELOG.md 原文（用户要求，不做二次加工）
          body_path: CHANGELOG.md
          files: release-assets/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
