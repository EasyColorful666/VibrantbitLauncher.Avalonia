# =============================================================================
# VibrantbitLauncher.Avalonia — 跨平台桌面构建工作流
#
# 覆盖 7 个运行时目标（RID）：
#   win-x64 / win-x86 / win-arm64 / linux-x64 / linux-arm64 / osx-x64 / osx-arm64
#
# 触发：
#   - 推送到 main 分支（仅构建，不上传 Release）
#   - 推送以 v 开头的 tag（构建 + 自动创建 GitHub Release）
#   - 手动触发 (workflow_dispatch)
#
# 设计：
#   本工作流**不重复实现发布逻辑**，直接调用仓库根目录的 publish-all.sh
#   （与本地 `.\publish-all.ps1` 行为一致），避免两套逻辑长期漂移。
#   脚本会按 RID 发布、按平台打包、算校验和，产物统一落在 dist/。
#
#   每个 RID 在「对应平台的 runner」上构建：Avalonia 的原生库虽然能跨平台
#   交叉发布，但在目标平台上构建能顺带验证该平台的编译期行为，更保险。
# =============================================================================

name: Build Desktop

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支/PR 只保留最新一次运行，节省 CI 分钟
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: VibrantbitLauncher.Avalonia
  # 框架依赖单文件发布（与 csproj 的 <SelfContained>false</SelfContained> 一致）
  SELF_CONTAINED: false

jobs:
  # ---------------------------------------------------------------------------
  # 构建矩阵：每个 RID 在对应平台的 runner 上发布
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-x86,     os: windows-latest }
          - { rid: win-arm64,   os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: osx-x64,     os: macos-latest }
          - { rid: osx-arm64,   os: macos-latest }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Publish ${{ matrix.rid }}
        shell: bash
        run: |
          ARGS=(--rids "${{ matrix.rid }}")
          if [ "$SELF_CONTAINED" = "true" ]; then ARGS+=(--self-contained); fi
          bash ./publish-all.sh "${ARGS[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 仅在推送 v* tag 时，把全部产物汇总成一个 GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-*
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: ls -lh artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*
